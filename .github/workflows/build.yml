
name: Build Ronielson Motos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        unzip -o RonielsonMotos_Projeto_Android_Backup_Teste30Dias.zip
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar componentes Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        run: cd RonielsonMotos_Android && gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Ronielson-Motos-APK
          path: RonielsonMotos_Android/app/build/outputs/apk/debug/app-debug.apk
